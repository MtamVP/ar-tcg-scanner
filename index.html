<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TCG AR Viewer</title>
    
    <!-- Dependencies -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.4.0/dist/aframe-extras.min.js"></script>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-pokemon">

    <!-- UI Overlay (Scanning State) -->
    <div class="scanning-overlay" id="scanning-overlay">
        <div class="scanning-reticle">
            <div class="scanning-reticle-inner-1"></div>
            <div class="scanning-reticle-inner-2"></div>
            <div class="scanning-line"></div>
        </div>
        <div class="scanning-text" id="scanning-text">Scanning for Pokémon TCG cards...</div>
    </div>

    <!-- Camera Switch Button -->
    <div class="camera-switch-btn" id="camera-switch-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <path d="M12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path>
            <polyline points="20 10 20 6 16 6"></polyline>
        </svg>
    </div>

    <!-- Navigation Bar -->
    <div class="ui-navbar">
        <div class="nav-tab active" data-theme="theme-pokemon">Pokémon Scanner</div>
        <div class="nav-tab" data-theme="theme-yugioh">Yu-Gi-Oh! Scanner</div>
    </div>

    <!-- AR Scene -->
    <a-scene 
        mindar-image="imageTargetSrc: assets/targets.mind; filterMinCF:0.0001; filterBeta: 0.001; facingMode: user;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-assets id="dynamic-assets"></a-assets>

        <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>
        <a-light type="directional" position="0.5 1 1" intensity="1.5"></a-light>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Targets will be injected here by main.js -->

    </a-scene>

    <!-- External JS -->
    <script src="main.js"></script>
</body>
</html>
