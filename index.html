<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TCG AR Viewer</title>
    <meta name="description" content="WebAR app that recognizes Pokémon & Yu-Gi-Oh! TCG cards and displays 3D characters.">
    
    <!-- THREE r148 = last version with global GLTFLoader script -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.148.0/examples/js/loaders/GLTFLoader.js"></script>
    <!-- MindAR THREE.js uses window.THREE set above -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-pokemon">

    <!-- UI Overlay (Scanning State) -->
    <div class="scanning-overlay" id="scanning-overlay">
        <div class="scanning-reticle">
            <div class="scanning-reticle-inner-1"></div>
            <div class="scanning-reticle-inner-2"></div>
            <div class="scanning-line"></div>
        </div>
        <div class="scanning-text" id="scanning-text">Scanning for Pokémon TCG cards...</div>
    </div>

    <!-- Camera Switch Button -->
    <div class="camera-switch-btn" id="camera-switch-btn" style="opacity:0.4;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <path d="M12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path>
            <polyline points="20 10 20 6 16 6"></polyline>
        </svg>
    </div>

    <!-- Navigation Bar -->
    <div class="ui-navbar">
        <div class="nav-tab active" data-theme="theme-pokemon">Pokémon Scanner</div>
        <div class="nav-tab" data-theme="theme-yugioh">Yu-Gi-Oh! Scanner</div>
    </div>

    <!-- AR Container: MindAR injects camera feed + canvas here -->
    <div id="ar-container"></div>

    <!-- External JS -->
    <script src="main.js"></script>
</body>
</html>
